name: Mini Codex Windows package

on:
  push:
    branches: [main]
    tags: [desktop-v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Windows desktop packages
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packager
        run: python -m pip install --disable-pip-version-check PyInstaller==6.20.0

      - name: Build desktop application
        shell: pwsh
        run: |
          $root = $PWD.Path
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name MiniCodex `
            --add-data "$root\mini_codex\web;web" `
            --distpath "$root\dist" --workpath "$root\build\work" --specpath "$root\build" `
            "$root\mini_codex\desktop.py"

      - name: Assemble and verify portable folder
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "dist/MiniCodex"
          $required = @(
            "MiniCodex.exe",
            "_internal/web/index.html",
            "_internal/web/app.js",
            "_internal/web/style.css",
            "_internal/web/robot.svg"
          )
          foreach ($item in $required) {
            $path = Join-Path $bundle $item
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Windows package is missing $item"
            }
          }
          Copy-Item -LiteralPath "Start-Mini-Codex.cmd" -Destination $bundle
          @"
          Mini Codex for Windows

          1. Extract this folder.
          2. Run Start-Mini-Codex.cmd or MiniCodex.exe.
          3. Install and sign in to the official Codex CLI separately.

          The Codex CLI is not included. Mini Codex stores its local data in
          %LOCALAPPDATA%\MiniCodex and only listens on this computer.
          This portable package is unsigned and is not a Microsoft Store installer.
          "@ | Set-Content -LiteralPath (Join-Path $bundle "README.txt") -Encoding utf8
          Compress-Archive -Path (Join-Path $bundle "*") -DestinationPath "dist/MiniCodex-Windows.zip" -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath "dist/MiniCodex-Windows.zip" -PathType Leaf)) {
            throw "Windows ZIP was not created"
          }

      - name: Install NSIS packager
        shell: pwsh
        run: choco install nsis.install --version=3.12.0 --no-progress --yes

      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $compiler = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $compiler) {
            $candidate = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "NSIS\makensis.exe"
            if (Test-Path -LiteralPath $candidate) { $compiler = @{ Source = $candidate } }
          }
          if (-not $compiler) { throw "NSIS compiler was not installed" }
          $version = if ($env:GITHUB_REF_NAME -match '^desktop-v(\d+\.\d+\.\d+)$') { $Matches[1] } else { "0.1.2" }
          & $compiler.Source "/NOCD" "/INPUTCHARSET" "UTF8" "/DAPP_VERSION=$version" "installer\MiniCodex.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed to build the installer (exit $LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath "dist\MiniCodex-Setup.exe" -PathType Leaf)) { throw "Windows installer was not created" }

      - name: Smoke test per-user installer and uninstaller
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "MiniCodexInstallerSmoke"
          $setup = Join-Path $PWD "dist\MiniCodex-Setup.exe"
          $install = Start-Process -FilePath $setup -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }
          $executable = Join-Path $installDir "MiniCodex.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw "Installer did not install MiniCodex.exe" }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir "_internal\web\index.html") -PathType Leaf)) { throw "Installer is missing the local web interface" }
          $env:MINI_CODEX_DATA = Join-Path $env:RUNNER_TEMP "MiniCodex Installer Smoke Data"
          $env:MINI_CODEX_SMOKE_TEST = "1"
          $env:MINI_CODEX_SMOKE_LOG = Join-Path $installDir "smoke-error.log"
          $process = Start-Process -FilePath $executable -Wait -PassThru -WindowStyle Hidden
          if (Test-Path -LiteralPath $env:MINI_CODEX_SMOKE_LOG) {
            Get-Content -LiteralPath $env:MINI_CODEX_SMOKE_LOG
            throw "Installed Mini Codex failed its local HTTP startup test (exit $($process.ExitCode))"
          }
          if ($process.ExitCode -ne 0) { throw "Installed Mini Codex exited with code $($process.ExitCode)" }
          $uninstaller = Join-Path $installDir "Uninstall.exe"
          $remove = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru -WindowStyle Hidden
          if ($remove.ExitCode -ne 0) { throw "Uninstaller exited with code $($remove.ExitCode)" }
          if (Test-Path -LiteralPath $installDir) { throw "Uninstaller left installation files behind" }

      - name: Smoke test frozen Windows executable
        shell: pwsh
        run: |
          $env:MINI_CODEX_DATA = Join-Path $PWD "build/smoke-data"
          $env:MINI_CODEX_SMOKE_TEST = "1"
          $env:MINI_CODEX_SMOKE_LOG = Join-Path $PWD "build/smoke-error.log"
          $process = Start-Process `
            -FilePath (Join-Path $PWD "dist/MiniCodex/MiniCodex.exe") `
            -Wait -PassThru -WindowStyle Hidden
          if (Test-Path -LiteralPath $env:MINI_CODEX_SMOKE_LOG) {
            Get-Content -LiteralPath $env:MINI_CODEX_SMOKE_LOG
            throw "Frozen Mini Codex failed its local HTTP startup test (exit $($process.ExitCode))"
          }
          if ($process.ExitCode -ne 0) {
            throw "Frozen Mini Codex exited with code $($process.ExitCode)"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: MiniCodex-Windows
          path: |
            dist/MiniCodex-Windows.zip
            dist/MiniCodex-Setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged Windows package
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: MiniCodex-Windows
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "release/MiniCodex-Windows.zip" `
            "release/MiniCodex-Setup.exe" `
            --repo Franksyh/AI-agent `
            --verify-tag `
            --title "Mini Codex Windows $env:GITHUB_REF_NAME" `
            --notes "Windows per-user installer: run MiniCodex-Setup.exe to install under the current Windows user, create shortcuts, and register an uninstaller. The portable ZIP remains available as an alternative. Python is bundled; install and sign in to the official Codex CLI separately. The installer is unsigned and is not a Microsoft Store package."
